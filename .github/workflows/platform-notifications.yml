name: Platform daily notifications

# Runs the daily notification rules (class-updates digest; fee e-mails are manual since phase 41)
# and emails any un-emailed notifications to parents via Brevo. Dev: manual runs only, no e-mails.
# Repo secrets required:
#   PLATFORM_SUPABASE_URL          e.g. https://xxxx.supabase.co
#   PLATFORM_SUPABASE_SERVICE_KEY  the SECRET (service_role) key
#   BREVO_API_KEY                  from app.brevo.com -> SMTP & API -> API keys
# Until the secrets exist this workflow exits quietly.

on:
  schedule:
    - cron: "30 16 * * *" # daily ~8:30-9:30am Pacific (fee rules + email dispatch)
    - cron: "30 1 * * *"  # daily ~5:30-6:30pm Pacific (class-updates evening digest)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  notify:
    # Dev never runs on a timer and never e-mails anyone (President 2026-11-10): the same file runs in
    # both repos; in falahacademywa-dev only a manual run (Actions -> Run workflow) does anything.
    if: github.event_name == 'workflow_dispatch' || github.repository != 'falahacademywa/falahacademywa-dev'
    runs-on: ubuntu-latest
    steps:
      - name: Run daily rules and dispatch emails
        run: |
          URL="${{ secrets.PLATFORM_SUPABASE_URL }}"
          KEY="${{ secrets.PLATFORM_SUPABASE_SERVICE_KEY }}"
          BREVO="${{ secrets.BREVO_API_KEY }}"
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Supabase secrets not set yet - skipping."
            exit 0
          fi

          # 1) Daily rules (fee reminders etc.)
          created=$(curl -sf -X POST "$URL/rest/v1/rpc/run_daily_notifications" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d '{}')
          echo "Daily rule notifications created: $created"

          # 1b) Wednesday reminder to teachers with app access (phase 28; 0 on other days)
          tr=$(curl -s -X POST "$URL/rest/v1/rpc/run_teacher_reminders" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d '{}')
          echo "Teacher reminders created: $tr"

          if [ -z "$BREVO" ]; then
            echo "BREVO_API_KEY not set - portal notifications only, no emails."
            exit 0
          fi

          # 2) Fetch un-emailed notifications joined with recipient emails
          rows=$(curl -sf "$URL/rest/v1/notifications?select=id,title,message,profiles!notifications_recipient_id_fkey(email,full_name)&emailed=is.false&limit=100" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          count=$(echo "$rows" | jq length)
          echo "Notifications to email: $count"
          [ "$count" -eq 0 ] && exit 0

          # 3) Send each via Brevo and mark emailed
          echo "$rows" | jq -c '.[]' | while read -r n; do
            id=$(echo "$n" | jq -r '.id')
            email=$(echo "$n" | jq -r '.profiles.email // empty')
            name=$(echo "$n" | jq -r '.profiles.full_name // "Parent"')
            title=$(echo "$n" | jq -r '.title')
            message=$(echo "$n" | jq -r '.message')
            if [ -n "$email" ] && [[ "$email" != *"test.local"* ]] && [ "$GITHUB_REPOSITORY" != "falahacademywa/falahacademywa-dev" ]; then
              payload=$(jq -n --arg to "$email" --arg name "$name" --arg subj "$title" --arg msg "$message" \
                '{sender: {name: "Falah Academy", email: "falahacademywa@gmail.com"},
                  to: [{email: $to, name: $name}],
                  subject: ("Falah Academy: " + $subj),
                  htmlContent: ("<p>Assalamu Alaikum " + ($name|@html) + ",</p><p>" + ($msg|@html) + "</p><p>Details: <a href=\"https://falahacademywa.org/platform/\">Family Portal</a></p><p>— Falah Academy</p>")}')
              http=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://api.brevo.com/v3/smtp/email" \
                -H "api-key: $BREVO" -H "Content-Type: application/json" -d "$payload")
              # never print the address: this repo and its Actions logs are public
              echo "notification $id : HTTP $http"
            else
              http=skip
              echo "notification $id : skipped (test/no email/dev)"
            fi
            # mark as e-mailed only when Brevo accepted it, it was skipped, or it was refused for good
            # (4xx other than 429); 429/5xx/network errors stay un-emailed and are retried next run
            case "$http" in
              2??|skip|400|401|403|404|422) curl -sf -X PATCH "$URL/rest/v1/notifications?id=eq.$id" \
                  -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
                  -H "Content-Type: application/json" -d '{"emailed": true}' > /dev/null ;;
              *) echo "notification $id : left for the next run" ;;
            esac
          done
